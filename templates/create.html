{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>➕ Create Hosting</h1>

    <p class="muted">
        Upload your Python bot, Node.js app,
        Java app or PHP project.
    </p>


    <form
        method="post"
        enctype="multipart/form-data"
    >

        <label>
            Project Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="My Python Bot"
            required
        >


        <label>
            Project Type
        </label>

        <select name="kind" required>

            <option value="Python">
                Python (.py)
            </option>

            <option value="Node.js">
                Node.js (.js)
            </option>

            <option value="Java">
                Java (.jar)
            </option>

            <option value="PHP">
                PHP (.php)
            </option>

            <option value="Static">
                Web / HTML
            </option>

        </select>


        <label>
            Upload File
        </label>

        <input
            type="file"
            name="file"
            required
        >


        <button type="submit">
            🚀 Upload & Create
        </button>

    </form>

</div>

{% endblock %}
