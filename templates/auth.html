{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>
        {% if mode == "register" %}
            Create Account
        {% else %}
            Login
        {% endif %}
    </h1>


    {% if error %}

        <p>
            {{ error }}
        </p>

    {% endif %}


    <form method="post">

        <input
            name="email"
            type="email"
            placeholder="Email"
            required
        >


        <input
            name="password"
            type="password"
            placeholder="Password"
            required
        >


        <button type="submit">

            {% if mode == "register" %}
                Register
            {% else %}
                Login
            {% endif %}

        </button>

    </form>


    {% if mode == "register" %}

        <a href="/login">
            Already have an account? Login
        </a>

    {% else %}

        <a href="/register">
            Create a new account
        </a>

    {% endif %}

</div>

{% endblock %}
